name: Preview GitHub Pages

on:
  push:
    branches:
      - cursor/fase-a-auditoria-017a
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-justech
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /website-justech
          NEXT_PUBLIC_SITE_URL: https://faustosantana.github.io/website-justech
      - run: npm run test:staging
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages already enabled"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
